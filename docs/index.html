<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JEE Knowledge Base</title>

    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>

</head>

<body>

<header>

    <div class="header-top">

        <h1>JEE Knowledge Base</h1>

        <div class="header-controls">

            <div class="theme-switch">
                <span class="theme-ico sun">☀</span>

                <label class="switch">
                    <input id="themeToggle" type="checkbox"/>
                    <span class="slider"></span>
                </label>

                <span class="theme-ico moon">☾</span>
            </div>

            <div class="ai">

                <button id="askAiBtn" class="ai-btn" type="button">
                    <span class="ai-spark">✨</span>
                    <span>Ask AI</span>
                    <span class="ai-caret">▾</span>
                </button>

                <div id="aiMenu" class="ai-menu">

                    <button class="ai-item" data-ai="chatgpt">ChatGPT</button>
                    <button class="ai-item" data-ai="claude">Claude</button>
                    <button class="ai-item" data-ai="gemini">Gemini</button>
                    <button class="ai-item" data-ai="copilot">Copilot</button>
                    <button class="ai-item" data-ai="perplexity">Perplexity</button>

                </div>

            </div>
        </div>
    </div>

    <p>Physics • Chemistry • Maths • English • Computer Science</p>

</header>


<main class="grid">


    <section class="card">

        <h2>Search Notes</h2>

        <div class="search-wrap">
            <input id="q" placeholder="Search topic, formula, concept…" />
            <div id="searchSuggestions" class="suggestions"></div>
        </div>

        <div class="row">

            <select id="subject">
                <option value="">All Subjects</option>
                <option>Physics</option>
                <option>Chemistry</option>
                <option>Maths</option>
                <option>English</option>
                <option>Computer Science</option>
            </select>

            <select id="exam">
                <option value="">All Levels</option>
                <option>School</option>
                <option>JEE_Main</option>
                <option>JEE_Advanced</option>
            </select>

        </div>


        <div class="manage-bar">

            <label class="manage-toggle">
                <input type="checkbox" id="manageMode" />
                <span>Manage Notes</span>
            </label>

            <button id="deleteSelectedBtn" disabled>Delete Selected Notes</button>

        </div>


        <div id="results"></div>

        <div id="pager" class="pager">

            <button id="prevBtn" disabled>← Prev</button>
            <span id="pageInfo" class="muted"></span>
            <button id="nextBtn" disabled>Next →</button>

        </div>

    </section>



    <section class="card">

        <h2>Add Notes (Voice / Text)</h2>


        <div class="row">

            <select id="add_subject">
                <option>Physics</option>
                <option>Chemistry</option>
                <option>Maths</option>
                <option>English</option>
                <option>Computer Science</option>
            </select>

            <input id="add_topic" placeholder="Topic path e.g. Mechanics/Laws of Motion" />

        </div>


        <div class="row">

            <select id="add_exam">
                <option>School</option>
                <option>JEE_Main</option>
                <option>JEE_Advanced</option>
            </select>

            <input id="add_tags" placeholder="tags: friction, fbd, newton" />

        </div>


        <div class="input-wrap">
            <input id="add_title" placeholder="Title e.g. Newton’s Laws" />
            <div id="titleSuggestions" class="suggestions"></div>
        </div>


        <div class="row">
            <button id="mic">🎙 Start Voice</button>
            <button id="stopMic" disabled>⏹ Stop</button>
        </div>



        <div class="input-wrap">

<textarea
        id="add_body"
        rows="12"
        placeholder="Write your note in Markdown…"
></textarea>

            <div id="bodySuggestions" class="suggestions"></div>

        </div>



        <!-- IMAGE SECTION -->

        <div class="image-block">

            <h3>Insert Image</h3>

            <div class="row">

                <input
                        type="file"
                        id="imageFile"
                        accept="image/*"
                />

                <input
                        id="imageAltText"
                        placeholder="Alt text e.g. Free body diagram"
                />

                <button id="insertImageBtn" type="button">
                    Insert Image
                </button>

            </div>
        </div>



        <div class="row">

            <button id="gen">Add Notes</button>

            <button id="openGithub" disabled>
                Submit Notes
            </button>

            <button id="clearMd">Clear</button>

            <button id="cancelEdit" style="display:none;">
                Cancel Edit
            </button>

        </div>


        <pre id="mdPreview" class="preview"></pre>

    </section>

</main>



<script src="app.js" defer></script>

</body>
</html>
